name: Fast NodeJS CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup NodeJS
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install App Dependencies
        # Reproduce the committed lock graph without re-resolving optional native peers.
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Run App Type Check
        run: npm run typecheck

      - name: Install API Dependencies
        run: npm ci --ignore-scripts
        working-directory: backend

      - name: Test all declared sources and enforce 85 percent weighted line coverage
        run: npm run test:coverage

      - name: Retain coverage evidence even when the threshold fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: error

      - name: Quality Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        with:
          args: >
            -Dsonar.projectKey=BarbaraGaito_MiSendero
            -Dsonar.organization=misendero
            -Dsonar.sources=app,mobile,services,database,ai,types,scripts,backend/src,backend/scripts,app.config.js,metro.config.js
            -Dsonar.tests=__mocks__,testing,services/__tests__,ai/__tests__,database/__tests__,mobile/components/__tests__,mobile/hooks/__tests__,mobile/screens/__tests__,backend/tests
            -Dsonar.exclusions=**/node_modules/**,**/coverage/**,training/**,tmp/**,**/__tests__/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true
